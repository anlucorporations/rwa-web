# =============================================================================
# CI de `rwa-web` (O3.5 · RF-W-15)
# =============================================================================
# Gates: check-network-literals · check-no-private-keys · check-contract-drift
#        · check_sincronizacion_datos · typecheck · lint · test (con cobertura)
#        · build ×3 · accesibilidad estática · presupuesto de rendimiento
#        · validación estática de assets Docker.
#        Auditoría de accesibilidad en navegador: job manual `quality:a11y-browser`.
#
# El gate `check-abi-drift` necesita el repo `rwa-sc` (fuente de sc/abis y
# deployments). Se clona con `RWA_SC_REPO_URL` (variable de CI, con token de
# lectura); si no está definida, el job lo indica y falla de forma explícita,
# salvo que se marque como manual. `RWA_SC_REF` fija el SHA/tag de rwa-sc que se
# valida (recomendado: el commit publicado); vacío = HEAD de la rama por defecto.
# =============================================================================

stages:
  - validate
  - quality
  - build
  - e2e

default:
  image: node:22-bookworm
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - corepack prepare pnpm@9.15.9 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

variables:
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm"
  NEXT_TELEMETRY_DISABLED: "1"
  # H-05: SHA/tag de rwa-sc que valida `validate:abi-drift`. Fíjalo al commit
  # publicado (reproducibilidad); vacío = HEAD de la rama por defecto.
  RWA_SC_REF: ""

# --- Gates de integridad con los contratos -----------------------------------
validate:network-literals:
  stage: validate
  script:
    - bash scripts/check-network-literals.sh
    - bash scripts/check-no-private-keys.sh

validate:abi-drift:
  stage: validate
  script:
    - |
      if [ -z "${RWA_SC_REPO_URL:-}" ]; then
        echo "RWA_SC_REPO_URL no definida: no se puede comprobar la deriva de ABIs." >&2
        echo "Define la variable (token de lectura de rwa-sc) o ejecuta el gate en local." >&2
        exit 1
      fi
    - git clone --depth 1 "$RWA_SC_REPO_URL" ../rwa-sc
    - |
      if [ -n "${RWA_SC_REF:-}" ]; then
        echo "Fijando rwa-sc a $RWA_SC_REF"
        git -C ../rwa-sc fetch --depth 1 origin "$RWA_SC_REF"
        git -C ../rwa-sc checkout --detach FETCH_HEAD
      else
        echo "RWA_SC_REF no definida: se usa HEAD de la rama por defecto (no reproducible)"
      fi
    - bash scripts/check-contract-drift.sh
    # H-04: el espejo de artefactos de datos (D-102) también se protege en CI
    - bash RepoTecnico/check_sincronizacion_datos.sh --check

# --- Calidad estática ---------------------------------------------------------
quality:typecheck:
  stage: quality
  script:
    - pnpm -r --workspace-concurrency=1 --if-present typecheck

quality:lint:
  stage: quality
  script:
    - pnpm -r --workspace-concurrency=1 --if-present lint

quality:test:
  stage: quality
  script:
    - pnpm -r --workspace-concurrency=1 --if-present test

# Auditoría de accesibilidad en navegador real (opcional/manual: requiere imagen
# con Chromium y arrancar las 3 apps; la gate estática ya corre en build:apps).
quality:a11y-browser:
  stage: build
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  when: manual
  allow_failure: true
  script:
    - pnpm -r --workspace-concurrency=1 --if-present build
    - pnpm serve:o5
    - |
      for _ in $(seq 1 60); do
        if curl -fsS http://127.0.0.1:4011/ >/dev/null 2>&1 \
          && curl -fsS http://127.0.0.1:4012/ >/dev/null 2>&1 \
          && curl -fsS http://127.0.0.1:4013/ >/dev/null 2>&1; then
          echo "apps listas"; break
        fi
        sleep 2
      done
    - pnpm a11y:browser:o5
    - pnpm exec node scripts/serve_o5.mjs --stop

# --- Build de producción ------------------------------------------------------
build:apps:
  stage: build
  script:
    - pnpm -r --workspace-concurrency=1 --if-present build
    - node scripts/a11y_o5.mjs
    - node scripts/perf_budget_o5.mjs
    - node scripts/docker_validate_o5.mjs
    - pnpm serve:o5
    - node scripts/headers_o5.mjs
    - pnpm exec node scripts/serve_o5.mjs --stop

# --- E2E contrato↔interfaz (H-06, O3.6) --------------------------------------
# Manual/nocturno: requiere un runner con red, Foundry (instalado en el job),
# Chromium (imagen Playwright) y DATABASE_URL con el esquema `rwa` aplicado
# (variable de CI `E2E_DATABASE_URL`). No bloquea el pipeline (allow_failure).
e2e:claim-flow:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  when: manual
  allow_failure: true
  needs: []
  variables:
    DATABASE_URL: "$E2E_DATABASE_URL"
  before_script:
    - corepack enable
    - corepack prepare pnpm@9.15.9 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - apt-get update -y && apt-get install -y --no-install-recommends jq curl
    - curl -L https://foundry.paradigm.xyz | bash
    - export PATH="$HOME/.foundry/bin:$PATH" && foundryup
  script:
    - bash scripts/ci_e2e.sh
